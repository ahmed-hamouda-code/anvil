name: Request a Pro licence
description: Ask about a Pro licence key for your team.
title: "Pro licence request: "
labels: ["licence"]
body:
  - type: markdown
    attributes:
      value: "**This page is public.** Give only what you are happy to share; we will follow up with you directly."
  - type: input
    id: company
    attributes:
      label: Company or team
    validations:
      required: true
  - type: input
    id: users
    attributes:
      label: Number of users
      placeholder: "5"
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: The Pro features you are most interested in, or questions.
